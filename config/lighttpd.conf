server.modules = ( "mod_access", "mod_alias", "mod_redirect", "mod_fastcgi" )
server.document-root = "/config/usg-services/web"
server.upload-dirs = ( "/tmp" )
server.errorlog = "/var/log/lighttpd/error.log"
server.pid-file = "/var/run/lighttpd.pid"
server.username = "www-data"
server.groupname = "www-data"
server.tag = "Server"
index-file.names = ( "index.php", "index.html" )
url.access-deny = ( "~", ".inc", ".json", ".bak", ".sh", ".py", ".token" )
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )
server.dir-listing = "disable"
include "/etc/lighttpd/mime.conf"
include "/etc/lighttpd/conf-enabled/15-fastcgi-php.conf"
include "/config/usg-services/tls/10-ssl.conf"
