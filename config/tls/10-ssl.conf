# /usr/share/doc/lighttpd-doc/ssl.txt
# 
# Persistent custom TLS configuration for USG Services
server.port = 80

$SERVER["socket"] == "0.0.0.0:443" {
	ssl.engine  = "enable"
	ssl.use-sslv3 = "disable"
	ssl.pemfile = "/config/usg-services/tls/server.pem"
	ssl.cipher-list = "ECDSA aRSA+HIGH !3DES +kEDH +kRSA !kSRP !kPSK !NULL !RC4"
}

$SERVER["socket"] == "[0::0]:80" { }

$SERVER["socket"] == "[0::0]:443" {
	ssl.engine  = "enable"
	ssl.use-sslv3 = "disable"
	ssl.pemfile = "/config/usg-services/tls/server.pem"
	ssl.cipher-list = "ECDSA aRSA+HIGH !3DES +kEDH +kRSA !kSRP !kPSK !NULL !RC4"
}

$HTTP["scheme"] == "http" {
    $HTTP["url"] !~ "^/index.php/error/" {
        # IPv4 redirect
        $HTTP["host"] !~ "\[.*\]" {
            $HTTP["host"] =~ "^([^\:]+)(\:.*)?$" {
                url.redirect = (
                    "^(.*)$" => "https://%1:443$1"
                )
            }
        }
        # IPv6 redirect
        $HTTP["host"] =~ "\[.*\]" {
            $HTTP["host"] =~ "^([^]]+)(.)(\:.*)?$" {
                url.redirect = (
                    "^(.*)$" => "https://%1%2:443$1"
                )
            }
        }
    }
}
